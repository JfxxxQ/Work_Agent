<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能聊天助手</title>
    <!-- Vue2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <!-- Markdown解析库 marked CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0b0f14;
            --panel: rgba(18, 24, 33, 0.88);
            --panel-soft: rgba(255, 255, 255, 0.04);
            --line: rgba(255, 255, 255, 0.10);
            --line-strong: rgba(255, 255, 255, 0.16);
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #a3e635;
            --accent-2: #60a5fa;
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        html, body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.10), transparent 30%),
                radial-gradient(circle at bottom right, rgba(163, 230, 53, 0.08), transparent 26%),
                linear-gradient(180deg, #0a0e13, var(--bg));
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 72px 72px;
        }
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            height: 70px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 22px;
            background: rgba(10, 15, 22, 0.84);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            flex-shrink: 0;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(163, 230, 53, 0.96), rgba(96, 165, 250, 0.96));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #081018;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 10px 24px rgba(96, 165, 250, 0.18);
        }
        .system-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--text);
        }
        .header-actions {
            margin-left: auto;
        }
        .chat-header .send-btn {
            width: auto;
            min-width: 94px;
            height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border: 1px solid var(--line-strong);
            box-shadow: none;
        }
        .chat-header .send-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.18);
        }
        .chat-main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .history-sidebar {
            width: 290px;
            padding: 18px 14px;
            overflow-y: auto;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid var(--line);
        }
        .sidebar-title {
            font-size: 12px;
            color: var(--muted);
            margin: 4px 10px 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .history-item {
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #d1d5db;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.10);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.14);
            transform: translateY(-1px);
        }
        .chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .message-wrap {
            flex: 1;
            padding: 28px 40px 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .message-item {
            display: flex;
            margin-bottom: 22px;
            gap: 12px;
        }
        .message-user {
            flex-direction: row-reverse;
        }
        .message-ai {
            flex-direction: row;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0b0f14;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
        }
        .avatar-user {
            background: linear-gradient(135deg, #d1d5db, #94a3b8);
        }
        .avatar-ai {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }
        .bubble-box {
            max-width: min(70%, 760px);
        }
        .msg-time {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            padding: 0 4px;
        }
        .message-user .msg-time {
            text-align: right;
        }
        .bubble {
            padding: 14px 16px;
            border-radius: 16px;
            line-height: 1.75;
            font-size: 15px;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .bubble-user {
            color: #081018;
            background: linear-gradient(135deg, #e5e7eb, #cbd5e1);
            border-top-right-radius: 6px;
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.12);
        }
        .bubble-ai {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border: 1px solid var(--line);
            border-top-left-radius: 6px;
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.10);
        }
        .markdown-body {
            font-size: 15px;
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            margin: 12px 0 8px;
            line-height: 1.35;
        }
        .markdown-body p {
            margin: 8px 0;
        }
        .markdown-body pre {
            background: #0a0e13;
            color: #e5e7eb;
            padding: 12px 14px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .markdown-body code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 6px;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }
        .markdown-body ul,
        .markdown-body ol {
            padding-left: 22px;
            margin: 8px 0;
        }
        .chat-img,
        .chat-video {
            max-width: 100%;
            border-radius: 14px;
            margin: 8px 0;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
        }
        .chat-img {
            cursor: zoom-in;
        }
        .input-footer {
            padding: 18px 40px 22px;
            background: rgba(9, 13, 20, 0.90);
            border-top: 1px solid var(--line);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .input-box {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        #user-input {
            flex: 1;
            min-height: 92px;
            max-height: 220px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        #user-input::placeholder {
            color: #6b7280;
        }
        #user-input:focus {
            border-color: rgba(163, 230, 53, 0.48);
            box-shadow: 0 0 0 4px rgba(163, 230, 53, 0.10);
            background: rgba(255, 255, 255, 0.06);
        }
        .send-btn {
            width: 88px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #d1d5db, #9ca3af);
            color: #0b0f14;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.16);
        }
        .send-btn:hover {
            opacity: 0.96;
            transform: translateY(-1px);
            filter: brightness(1.03);
        }
        .send-btn:active {
            transform: translateY(0);
        }
        .img-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 6, 12, 0.94);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .modal-close {
            position: absolute;
            top: 22px;
            right: 28px;
            color: #fff;
            font-size: 40px;
            line-height: 1;
            cursor: pointer;
            opacity: 0.85;
        }
        .modal-img {
            max-width: min(90%, 1200px);
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.40);
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        @media (max-width: 960px) {
            .history-sidebar {
                width: 230px;
            }
            .message-wrap {
                padding: 22px 24px 16px;
            }
            .input-footer {
                padding: 16px 24px 18px;
            }
        }
        @media (max-width: 768px) {
            .history-sidebar {
                display: none;
            }
            .chat-header {
                padding: 0 16px;
            }
            .system-name {
                font-size: 16px;
            }
            .message-wrap {
                padding: 18px 16px 14px;
            }
            .bubble-box {
                max-width: 82%;
            }
            .input-footer {
                padding: 14px 16px 16px;
            }
            .input-box {
                flex-wrap: wrap;
            }
            .send-btn {
                width: auto;
                min-width: 88px;
                flex: 1 1 110px;
            }
            .chat-header .send-btn {
                min-width: 88px;
                flex: 0 0 auto;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <div class="chat-header">
            <div class="logo-icon">AI</div>
            <div class="system-name">智能AI聊天助手</div>
            <div class="header-actions">
                <button class="send-btn" type="button" @click="exit">退出登录</button>
            </div>

        </div>

        <!-- 主体：侧边历史 + 聊天区 -->
        <div class="chat-main">
            <!-- 左侧聊天历史 -->
            <div class="history-sidebar">
                <div class="sidebar-title">对话历史</div>
                <div class="history-item" v-for="(item, idx) in historyList" :key="idx">
                    {{ item.title }}
                </div>
            </div>

            <!-- 中间聊天消息区域 -->
            <div class="chat-content">
                <div class="message-wrap" ref="msgScroll">
                    <!-- 循环渲染所有消息 -->
                    <div
                        class="message-item"
                        :class="msg.role === 'user' ? 'message-user' : 'message-ai'"
                        v-for="(msg, index) in chatList"
                        :key="index"
                    >
                        <!-- 头像 -->
                        <div class="avatar" :class="msg.role === 'user' ? 'avatar-user' : 'avatar-ai'">
                            {{ msg.role === 'user' ? '我' : 'AI' }}
                        </div>
                        <!-- 消息气泡区域 -->
                        <div class="bubble-box">
                            <div class="msg-time">{{ msg.time }}</div>
                            <!-- Markdown渲染内容 -->
                            <div
                                class="bubble markdown-body"
                                :class="msg.role === 'user' ? 'bubble-user' : 'bubble-ai'"
                                v-html="renderMarkdown(msg.content)"
                            ></div>
                        </div>
                    </div>
                </div>

                <!-- 底部输入框 -->
                <div class="input-footer">
                    <div class="input-box">
                        <textarea
                            id="user-input"
                            v-model="inputMsg"
                            placeholder="请输入消息，Enter发送，Shift+Enter换行"
                            @keydown="handleKeyDown"
                        ></textarea>
                        <button class="send-btn" @click="sendMessage">发送</button>
                        <button class="send-btn" @click="sendVosk">语音输入</button>

                    </div>
                </div>
            </div>
        </div>

        <!-- 图片放大弹窗 -->
        <div v-if="showImgModal" class="img-modal" @click="closeImgModal">
            <span class="modal-close">×</span>
            <img class="modal-img" :src="modalImgSrc" alt="大图">
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                     w:null,//websocket对象
                    userId: "",//用户id
                    // 输入框内容
                    inputMsg: "",
                    // 聊天消息列表，内置4类测试数据
                    chatList: [
                        // 1.普通文本消息
                        {
                            role: "user",
                            content: "你好，介绍一下自己",
                            time: this.getNowTime()
                        },
                        {
                            role: "ai",
                            content: "你好！我是AI聊天助手。",
                            time: this.getNowTime()
                        },

                    ],
                    // 左侧对话历史列表
                    historyList: [
                        { title: "代码开发对话" },
                        { title: "风景图片生成" },
                        { title: "短视频文案创作" },
                        { title: "数学问题解答" }
                    ],
                    // 图片弹窗控制
                    showImgModal: false,
                    modalImgSrc: "",
                    // SSE实例缓存
                    sseInstance: null,

                        }
            },
            mounted() {

                            //获取用户登录的信息
                 const userId = localStorage.getItem("userId");
                 //把 userId值 传
                 this.userId = userId;
                 if (!userId){
                   //跳转道聊天页面
                    window.location.href="/static/login.html";
                 }
                // 页面加载自动滚动到底部
                this.scrollToBottom();
            },
            methods: {
                sendVosk(){
                            //创建一个websocket 协议
                 this.w = new WebSocket("ws://localhost:8000/vosk");
                  //监听开启链接事件
                  this.w.onopen = function (event) {
                      console.log("链接成功");
                  }
                    //监听信息接收事件
                  const self = this;
                  this.w.onmessage =function (event){
                      //判断是否显示语音提示给用户
                      if (event.data.indexOf("请说话...") >-1){
                          alert("请说话")
                      }else{
                          self.inputMsg =event.data;
                          //发送信息
                          self.sendMessage();
                      }

                  }
                },

                exit(){//退出登录
                    localStorage.removeItem("userId");
                    window.location.href="/static/login.html";
                },
                // 获取当前格式化时间
                getNowTime() {
                    const date = new Date();
                    const h = String(date.getHours()).padStart(2, '0');
                    const m = String(date.getMinutes()).padStart(2, '0');
                    const s = String(date.getSeconds()).padStart(2, '0');
                    return `${h}:${m}:${s}`;
                },
                // Markdown解析 + 替换图片标签，增加点击放大class
                renderMarkdown(mdText) {
                    if (!mdText) return "";
                    // marked基础转换
                    let html = marked.parse(mdText);
                    // 匹配所有图片，添加chat-img类用于点击放大
                    html = html.replace(/<img/g, '<img class="chat-img"');
                    return html;
                },
                // 滚动聊天区到底部
                scrollToBottom() {
                    this.$nextTick(() => {
                        const scrollDom = this.$refs.msgScroll;
                        if (scrollDom) scrollDom.scrollTop = scrollDom.scrollHeight;
                    })
                },
                // 键盘监听：Enter发送，Shift+Enter换行
                handleKeyDown(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                },

                // 发送消息（保留原有SSE流式逻辑）
                sendMessage() {
                    const msg = this.inputMsg.trim();
                    if (!msg) return;
                    // 1.添加用户消息
                    const userMsg = {
                        role: "user",
                        content: msg,
                        time: this.getNowTime()
                    }
                    this.chatList.push(userMsg);
                    // 2.创建空AI消息，用于流式追加
                    const aiMsg = {
                        role: "ai",
                        content: "正在思考，请稍等....",
                        time: this.getNowTime()
                    }
                    this.chatList.push(aiMsg);
                    // 清空输入框
                    this.inputMsg = "";
                    // 滚动到底部
                    this.scrollToBottom();

                    // SSE流式请求（和你原有逻辑保持一致）
                const params = `question=${encodeURIComponent(msg)}&user_id=${encodeURIComponent(this.userId)}`;
                    // 关闭上一次未完成的SSE连接
                    if (this.sseInstance) this.sseInstance.close();
                    this.sseInstance = new EventSource('/chat?' + params);

                    this.sseInstance.onmessage = (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            console.log("SSE返回数据：", data);
                            if (data.done) {
                                this.sseInstance.close();
                                this.sseInstance = null;
                                //处理异常情况的流式显示
                                if (data.error){
                                     aiMsg.content += data.data;
                                }

                            } else {
                                //判断是否有提示信息在ai内容，如果有，就删除
                                if(aiMsg.content.indexOf("正在思考，请稍等....")>-1){
                                   aiMsg.content="";
                                }
                                // 流式追加AI内容
                                aiMsg.content += data.data;
                                this.scrollToBottom();
                            }
                        } catch (err) {
                            console.error("SSE解析失败", err);
                        }
                    }
                    // SSE异常关闭
                    this.sseInstance.onerror = () => {
                        this.sseInstance.close();
                        this.sseInstance = null;
                    }
                }
            }
        })
    </script>
</body>
</html>
