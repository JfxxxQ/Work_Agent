<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI多智能体平台 · 登录</title>
    <!-- 保持原有Vue & jQuery 引用 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="/static/js/jquery-3.1.1.min.js"></script>

    <!-- 字体图标 (简洁风格) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg: #f4f1ea;
            --bg-accent: rgba(32, 41, 56, 0.04);
            --card: rgba(255, 255, 255, 0.82);
            --card-border: rgba(15, 23, 42, 0.08);
            --text: #111827;
            --muted: #6b7280;
            --line: rgba(17, 24, 39, 0.10);
            --brand: #111827;
            --brand-soft: #e7e2d8;
            --shadow: 0 24px 70px rgba(15, 23, 42, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(17, 24, 39, 0.05), transparent 30%),
                radial-gradient(circle at bottom right, rgba(17, 24, 39, 0.04), transparent 28%),
                linear-gradient(180deg, #faf8f3, var(--bg));
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent 0, transparent 49.8%, rgba(17, 24, 39, 0.04) 50%, transparent 50.2%),
                linear-gradient(0deg, transparent 0, transparent 49.8%, rgba(17, 24, 39, 0.03) 50%, transparent 50.2%);
            background-size: 120px 120px;
            opacity: 0.18;
        }

        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 44px 38px 34px;
            border-radius: 24px;
            background: var(--card);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 30px;
            background: linear-gradient(135deg, #111827, #374151);
            box-shadow: 0 12px 28px rgba(17, 24, 39, 0.18);
        }

        .brand h1 {
            margin: 0 0 8px;
            font-size: 27px;
            line-height: 1.2;
            letter-spacing: 0.01em;
            color: var(--text);
            font-weight: 700;
        }

        .brand p {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
            letter-spacing: 0.06em;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 17px;
            pointer-events: none;
            z-index: 2;
            transition: color 0.18s ease;
        }

        .input-group input {
            width: 100%;
            padding: 15px 18px 15px 50px;
            border-radius: 14px;
            border: 1px solid rgba(17, 24, 39, 0.10);
            background: rgba(255, 255, 255, 0.72);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .input-group input:focus {
            border-color: rgba(17, 24, 39, 0.28);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.06);
        }

        .input-group input:focus + i,
        .input-group:focus-within i {
            color: #111827;
        }

        .input-group .code-hint {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 12px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(17, 24, 39, 0.08);
            pointer-events: none;
            z-index: 1;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 13px 12px;
            border: 1px solid transparent;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .btn i {
            font-size: 15px;
        }

        .btn-primary {
            color: #fff;
            background: #111827;
            box-shadow: 0 14px 26px rgba(17, 24, 39, 0.16);
        }

        .btn-outline {
            color: var(--text);
            background: rgba(255, 255, 255, 0.72);
            border-color: rgba(17, 24, 39, 0.10);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary:hover {
            box-shadow: 0 18px 30px rgba(17, 24, 39, 0.20);
            background: #0f172a;
        }

        .btn-outline:hover {
            background: #fff;
            border-color: rgba(17, 24, 39, 0.16);
            box-shadow: 0 12px 22px rgba(15, 23, 42, 0.06);
        }

        .btn:active {
            transform: translateY(0) scale(0.99);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
        }

        .footer-note {
            margin-top: 26px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.08em;
        }

        .footer-note i {
            margin-right: 6px;
            color: #111827;
        }

        input[type="text"]::-ms-clear {
            display: none;
        }

        @media (max-width: 520px) {
            body {
                padding: 14px;
            }

            #app {
                padding: 34px 20px 24px;
                border-radius: 20px;
            }

            .brand {
                margin-bottom: 24px;
            }

            .brand-icon {
                width: 62px;
                height: 62px;
                font-size: 26px;
                border-radius: 18px;
            }

            .brand h1 {
                font-size: 23px;
            }

            .input-group input {
                padding: 14px 16px 14px 46px;
                font-size: 14px;
            }

            .input-group i {
                left: 15px;
                font-size: 16px;
            }

            .input-group .code-hint {
                right: 10px;
                padding: 3px 8px;
                font-size: 11px;
            }

            .btn {
                min-width: 100%;
                padding: 12px 12px;
            }

            .footer-note {
                margin-top: 22px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 品牌区 -->
    <div class="brand">
        <div class="brand-icon">
            <i class="fas fa-robot"></i>
        </div>
        <h1>AI 多智能体</h1>
        <p>安全 · 协作 · 下一代平台</p>
    </div>

    <!-- 邮箱输入 -->
    <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="text" placeholder="请输入邮箱" v-model="email" autocomplete="email">
    </div>

    <!-- 验证码输入 -->
    <div class="input-group">
        <i class="fas fa-shield-alt"></i>
        <input type="text" placeholder="请输入验证码" v-model="code" autocomplete="off">
        <!-- 纯装饰小标签 (不影响功能) -->
        <span class="code-hint"><i class="fas fa-lock"></i> 6位</span>
    </div>

    <!-- 按钮组 (完全保留原有逻辑) -->
    <div class="action-row">
        <button type="button" class="btn btn-outline" @click="sendCode">
            <i class="fas fa-paper-plane"></i> 发送验证码
        </button>
        <button type="button" class="btn btn-primary" @click="login">
            <i class="fas fa-sign-in-alt"></i> 登录
        </button>
    </div>

    <!-- 底部 (纯装饰) -->
    <div class="footer-note">
        <i class="fas fa-robot"></i> 多智能体系统 · 安全验证
    </div>
</div>

<script>
    // 您的原始JS代码 — 完全保留，未作任何修改
    new Vue({
        el:"#app",
        data:{
            email:"",
            code:""
        },
        mounted() {
            const userId = localStorage.getItem("userId");
            if (userId){
                window.location.href="/static/chat.html";
            }
        },
        methods: {
            sendCode() {
                $.ajax({
                    url:"/sendCode",
                    data:{"email":this.email},
                    success:function (rs){
                        console.log(rs);
                        if (rs.code === 200){
                            alert(rs.msg);
                        }else{
                            alert(rs.msg);
                        }
                    }
                })
            },
            login(){
                $.ajax({
                    url:"/login",
                    data:{"email":this.email,"code":this.code},
                    success:function (rs){
                        console.log(rs);
                        if (rs.code === 200){
                            alert(rs.msg);
                            localStorage.setItem("userId",rs.user_id);
                            window.location.href="/static/login.html";
                        }else{
                            alert(rs.msg);
                        }
                    }
                })
            }
        }
    })
</script>

</body>
</html>
